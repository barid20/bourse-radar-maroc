name: Auto Update Market Data Every 15m

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 openpyxl pandas
          pip install --no-deps git+https://github.com/Fredysessie/Casabourse.git || true

      - name: Run updater script
        run: python scripts/update_data.py

      - name: Commit and push data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update data.json"
          git fetch origin main
          git rebase -X theirs origin/main || (git rebase --abort && git merge -X ours origin/main -m "chore: sync main")
          git push origin main

